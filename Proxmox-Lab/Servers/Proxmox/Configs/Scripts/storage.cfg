############################################################
# Notes
############################################################
#
#  This file defines storage backends for Proxmox VE.
#  Each storage backend is defined by a block starting with
#  its type.
#  Supported types include dir, lvm, lvmthin, zfspool, nfs, etc.
#  Each block contains parameters specific to the storage type.
#  Common parameters include:
#
#   * pool = actual ZFS dataset name.
#
#   * nodes = list of Proxmox nodes that can access this storage.
#             (for single-node setups, use the node's hostname)
#   * path = mount point for dir type.
#            (must exist and be writable by pveuser)
#   * vgname = volume group name for lvm/lvmthin types.
#              (must exist and have free space)
#   * thinpool = thin pool name for lvmthin type.
#                (must exist in the specified vgname)
#   * zfspool = <id> : the Proxmox storage ID (must be unique).
#               (for zfspool type)
#   * maxfiles controls how many backups are kept.
#
#   * content = types of content allowed 
#               (images, rootdir, iso, backup.)
#               - Multiple types are comma-separated.  
#     
############################################################


############################################################
# Default Proxmox storage
############################################################

# Local directory on NVMe for ISOs, templates, backups
dir: local
    path /var/lib/vz
    content iso,vztmpl,backup
    maxfiles 5

# Local LVM-thin on NVMe for general-purpose VM/CT storage
lvmthin: local-lvm
    thinpool data
    vgname pve
    content rootdir,images
    nodes rksrv-pve

############################################################
# ZFS Pools and Datasets
############################################################

############################################################
# SSD ssdpool (fast VMs & scratch space)
############################################################

# SSD vmpool (fast workloads)
zfspool: vmpool-vm
    pool vmpool/vm
    content images,rootdir
    nodes rksrv-pve

zfspool: vmpool-ct
    pool vmpool/ct
    content rootdir
    nodes rksrv-pve

zfspool: vmpool-iso
    pool vmpool/iso
    content iso
    nodes rksrv-pve

##################################################
# HDD Mirror mediapool (media, backups, projects)
##################################################

# Streaming library for Plex/Jellyfin
# zfspool: mediapool-streaming
#     pool mediapool/streaming
#     content rootdir,images
#     nodes rksrv-pve

# Homelab VM/CT backups
# zfspool: mediapool-backups
#     pool mediapool/homelab-backups
#     content backup
#     maxfiles 10
#     nodes rksrv-pve

# # Project files (Windows PC share via Samba)
# zfspool: mediapool-kaden
#     pool mediapool/kaden
#     content rootdir
#     nodes rksrv-pve

# # Archives (family photos, Immich)
